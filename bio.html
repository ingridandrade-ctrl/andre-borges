<style>
  html,body{margin:0}
  body{
    background:
      radial-gradient(130% 45% at 50% 0%, color-mix(in oklab, var(--moss) 18%, transparent) 0%, transparent 60%),
      var(--ink-deep);
    color:var(--bone);
    min-height:100svh;
    display:flex;flex-direction:column;align-items:center;
    padding:0 1rem 2.5rem;
    font-family:'Inter',system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .bio{width:100%;max-width:440px}

  /* ---- capa + avatar ---- */
  .cover{
    position:relative;width:100%;height:186px;margin-top:1.1rem;
    border-radius:1.6rem;overflow:hidden;
    box-shadow:0 24px 48px -26px rgba(0,0,0,.6), inset 0 0 0 1px color-mix(in oklab, var(--bone) 10%, transparent);
  }
  .cover img{width:100%;height:100%;object-fit:cover;object-position:center 42%}
  .cover::after{
    content:"";position:absolute;inset:0;
    background:linear-gradient(180deg, color-mix(in oklab, var(--ink-deep) 30%, transparent) 0%, transparent 34%, transparent 55%, var(--ink-deep) 100%);
  }
  .head{position:relative;text-align:center;margin-top:-52px;z-index:2}
  .avatar{
    width:104px;height:104px;border-radius:50%;object-fit:cover;object-position:center 20%;
    display:block;margin:0 auto .7rem;
    border:3px solid var(--ink-deep);
    box-shadow:0 0 0 2px color-mix(in oklab, var(--ember-deep) 65%, transparent), 0 16px 30px -14px rgba(0,0,0,.65);
  }
  .head h1{
    font-family:'Playfair Display',Georgia,serif;font-weight:600;
    font-size:1.75rem;line-height:1.12;margin:0 0 .3rem;color:var(--bone)
  }
  .crp{
    font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:10.5px;letter-spacing:.13em;
    text-transform:uppercase;color:var(--moss-light);margin:0 0 .55rem
  }
  .tagline{
    font-size:.9rem;line-height:1.5;color:color-mix(in oklab, var(--bone) 78%, transparent);
    max-width:19rem;margin:0 auto
  }
  .tagline em{font-style:italic;color:var(--ember)}

  /* ---- cards de link com miniatura ---- */
  .links{display:flex;flex-direction:column;gap:.7rem;margin-top:1.7rem}
  .lk{
    display:flex;align-items:center;gap:.85rem;position:relative;
    padding:.6rem .95rem .6rem .6rem;border-radius:1.15rem;text-decoration:none;
    background:color-mix(in oklab, var(--bone) 7%, transparent);
    border:1px solid color-mix(in oklab, var(--bone) 14%, transparent);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.05);
    -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
    transition:transform .32s cubic-bezier(.22,1,.36,1), background .25s ease, border-color .25s ease, box-shadow .32s ease;
  }
  .lk:hover{transform:translateY(-2px);background:color-mix(in oklab, var(--bone) 11%, transparent);border-color:color-mix(in oklab, var(--bone) 24%, transparent);box-shadow:0 18px 34px -20px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,255,255,.06)}
  .lk .thumb{
    width:56px;height:56px;flex-shrink:0;border-radius:.85rem;object-fit:cover;
    box-shadow:inset 0 0 0 1px color-mix(in oklab, var(--bone) 12%, transparent)
  }
  .lk .txt{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1}
  .lk .t{font-family:'Playfair Display',Georgia,serif;font-weight:600;font-size:1.06rem;color:var(--bone);line-height:1.15}
  .lk .s{font-size:11.5px;color:color-mix(in oklab, var(--bone) 60%, transparent);letter-spacing:.01em}
  .lk .go{
    flex-shrink:0;width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    color:var(--bone);background:color-mix(in oklab, var(--bone) 9%, transparent);
    transition:transform .35s cubic-bezier(.22,1,.36,1), background .25s ease
  }
  .lk:hover .go{transform:translate(2px,-2px);background:color-mix(in oklab, var(--bone) 16%, transparent)}
  /* destaque no primário (agendar) */
  .lk-primary{
    background:linear-gradient(180deg, color-mix(in oklab, #d65e30 26%, transparent), color-mix(in oklab, #d65e30 14%, transparent));
    border-color:color-mix(in oklab, #d65e30 55%, transparent);
  }
  .lk-primary:hover{background:linear-gradient(180deg, color-mix(in oklab, #d65e30 34%, transparent), color-mix(in oklab, #d65e30 20%, transparent));border-color:color-mix(in oklab, #d65e30 72%, transparent)}
  .lk-primary .go{background:#d65e30}
  .lk-primary:hover .go{background:#c9542a}

  /* ---- redes ---- */
  .socials{display:flex;justify-content:center;gap:.75rem;margin-top:1.5rem}
  .soc{
    width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    color:var(--bone);text-decoration:none;
    background:color-mix(in oklab, var(--bone) 8%, transparent);
    border:1px solid color-mix(in oklab, var(--bone) 16%, transparent);
    transition:transform .32s cubic-bezier(.22,1,.36,1), background .25s ease, border-color .25s ease
  }
  .soc:hover{transform:translateY(-3px);background:var(--ember-deep);border-color:transparent}
  footer{
    text-align:center;margin-top:1.9rem;font-family:'IBM Plex Mono',ui-monospace,monospace;
    font-size:9.5px;letter-spacing:.15em;text-transform:uppercase;
    color:color-mix(in oklab, var(--bone) 42%, transparent)
  }
</style>
</head>
