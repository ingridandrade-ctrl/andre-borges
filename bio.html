<style>
  html,body{margin:0}
  body{
    background:var(--ink-deep);
    color:var(--bone);
    min-height:100svh;position:relative;overflow-x:hidden;
    display:flex;flex-direction:column;align-items:center;
    padding:0 1rem 2.5rem;
    font-family:'Inter',system-ui,sans-serif;-webkit-font-smoothing:antialiased;
  }

  /* ---- capa full-bleed atrás do cabeçalho ---- */
  .cover{position:absolute;top:0;left:0;width:100%;height:318px;z-index:0;overflow:hidden}
  /* imagem mais alta que a capa e alinhada embaixo: corta o topo (a janela) */
  .cover img{position:absolute;left:0;bottom:0;width:100%;height:432px;object-fit:cover;object-position:center}
  .cover::after{
    content:"";position:absolute;inset:0;
    background:linear-gradient(180deg,
      color-mix(in oklab, var(--ink-deep) 34%, transparent) 0%,
      transparent 26%,
      color-mix(in oklab, var(--ink-deep) 42%, transparent) 62%,
      var(--ink-deep) 98%);
  }

  .bio{width:100%;max-width:440px;position:relative;z-index:1}

  /* ---- cabeçalho ---- */
  .head{text-align:center;padding-top:186px}
  .avatar{
    width:106px;height:106px;border-radius:50%;object-fit:cover;object-position:center 20%;
    display:block;margin:0 auto .8rem;
    border:3px solid var(--ink-deep);
    box-shadow:0 0 0 2px color-mix(in oklab, var(--ember-deep) 68%, transparent), 0 18px 34px -14px rgba(0,0,0,.7);
  }
  .head h1{
    font-family:'Playfair Display',Georgia,serif;font-weight:600;
    font-size:1.85rem;line-height:1.12;margin:0 0 .32rem;color:var(--bone);
    text-shadow:0 2px 18px rgba(10,17,13,.5)
  }
  .crp{
    font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:10.5px;letter-spacing:.13em;
    text-transform:uppercase;color:var(--moss-light);margin:0 0 .6rem
  }
  .tagline{
    font-size:.9rem;line-height:1.5;color:color-mix(in oklab, var(--bone) 80%, transparent);
    max-width:19rem;margin:0 auto
  }
  .tagline em{font-style:italic;color:var(--ember)}

  /* ---- cards de link com ícone ---- */
  .links{display:flex;flex-direction:column;gap:.7rem;margin-top:1.8rem}
  .lk{
    display:flex;align-items:center;gap:.85rem;position:relative;
    padding:.7rem 1rem .7rem .7rem;border-radius:1.15rem;text-decoration:none;
    background:color-mix(in oklab, var(--bone) 7%, transparent);
    border:1px solid color-mix(in oklab, var(--bone) 14%, transparent);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.05);
    -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
    transition:transform .32s cubic-bezier(.22,1,.36,1), background .25s ease, border-color .25s ease, box-shadow .32s ease;
  }
  /* ao passar a mão, o card acende em terracota */
  .lk:hover{
    transform:translateY(-2px);
    background:linear-gradient(180deg, color-mix(in oklab, var(--ember-deep) 24%, transparent), color-mix(in oklab, var(--ember-deep) 13%, transparent));
    border-color:color-mix(in oklab, var(--ember-deep) 58%, transparent);
    box-shadow:0 18px 34px -18px rgba(20,32,26,.6), inset 0 1px 0 rgba(255,255,255,.06)
  }
  .lk:hover .chip{background:var(--ember-deep);box-shadow:inset 0 0 0 1px rgba(255,255,255,.18)}
  .chip{
    width:52px;height:52px;flex-shrink:0;border-radius:.9rem;display:flex;align-items:center;justify-content:center;
    color:var(--bone);
    background:color-mix(in oklab, var(--bone) 10%, transparent);
    box-shadow:inset 0 0 0 1px color-mix(in oklab, var(--bone) 14%, transparent);
  }
  .lk .txt{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1}
  .lk .t{font-family:'Playfair Display',Georgia,serif;font-weight:600;font-size:1.08rem;color:var(--bone);line-height:1.15}
  .lk .s{font-size:11.5px;color:color-mix(in oklab, var(--bone) 60%, transparent);letter-spacing:.01em}
  .lk .go{
    flex-shrink:0;width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    color:var(--bone);background:color-mix(in oklab, var(--bone) 9%, transparent);
    transition:transform .35s cubic-bezier(.22,1,.36,1), background .25s ease
  }
  .lk:hover .go{transform:translate(2px,-2px);background:var(--ember-deep)}

  /* ---- redes ---- */
  .socials{display:flex;justify-content:center;gap:.75rem;margin-top:1.5rem}
  .soc{
    width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    color:var(--bone);text-decoration:none;
    background:color-mix(in oklab, var(--bone) 8%, transparent);
    border:1px solid color-mix(in oklab, var(--bone) 16%, transparent);
    transition:transform .32s cubic-bezier(.22,1,.36,1), background .25s ease, border-color .25s ease
  }
  .soc:hover{transform:translateY(-3px);background:var(--ember-deep);border-color:transparent}
  footer{
    text-align:center;margin-top:1.9rem;font-family:'IBM Plex Mono',ui-monospace,monospace;
    font-size:9.5px;letter-spacing:.15em;text-transform:uppercase;
    color:color-mix(in oklab, var(--bone) 42%, transparent)
  }
</style>
</head>
